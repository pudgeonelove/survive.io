<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebGL FPS</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08070a;color:#fff;font-family:monospace}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 8px #fff}
#cross:before{left:8px;top:0;width:2px;height:18px}
#cross:after{left:0;top:8px;width:18px;height:2px}
#hud{position:absolute;left:18px;bottom:16px;font-size:18px;text-shadow:2px 2px #000}
#msg{position:absolute;left:50%;top:18px;transform:translateX(-50%);font-size:16px;text-align:center;text-shadow:2px 2px #000;color:#ffd66b}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
</style>
</head>
<body>
<div id="ui">
  <div id="cross"></div>
  <div id="hud"></div>
  <div id="msg">CLICK TO LOCK | WASD SPACE SHIFT | 1 REVOLVER 2 SHOTGUN | F / RMB PARRY</div>
  <div id="flash"></div>
</div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x07070b);
scene.fog=new THREE.Fog(0x07070b,18,95);

const camera=new THREE.PerspectiveCamera(78,innerWidth/innerHeight,.05,300);
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xffefe0,0x182244,1.35);
scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffd0a0,1.4);
sun.position.set(7,13,4);
scene.add(sun);

const matFloor=new THREE.MeshLambertMaterial({color:0x211824});
const matWall=new THREE.MeshLambertMaterial({color:0x362234});
const matRed=new THREE.MeshBasicMaterial({color:0xff274c});
const matGreen=new THREE.MeshLambertMaterial({color:0x19d45b});
const matBlue=new THREE.MeshLambertMaterial({color:0x2389ff});
const matYellow=new THREE.MeshBasicMaterial({color:0xffe64d});
const matOrbEnemy=new THREE.MeshBasicMaterial({color:0x42a8ff});
const matOrbPlayer=new THREE.MeshBasicMaterial({color:0xffea45});
const matBlood=new THREE.MeshBasicMaterial({color:0xd80d23});

const floor=new THREE.Mesh(new THREE.BoxGeometry(120,1,120),matFloor);
floor.position.y=-.55;
scene.add(floor);

for(let i=0;i<42;i++){
  const b=new THREE.Mesh(new THREE.BoxGeometry(2+Math.random()*5,1+Math.random()*7,2+Math.random()*5),matWall);
  const a=Math.random()*Math.PI*2,r=14+Math.random()*43;
  b.position.set(Math.cos(a)*r,b.geometry.parameters.height/2-.05,Math.sin(a)*r);
  b.rotation.y=Math.random()*Math.PI;
  scene.add(b);
}

const arenaRing=[];
for(let i=0;i<24;i++){
  const a=i/24*Math.PI*2;
  const w=new THREE.Mesh(new THREE.BoxGeometry(8,7,1.2),matWall);
  w.position.set(Math.cos(a)*58,3,Math.sin(a)*58);
  w.rotation.y=-a;
  scene.add(w);
  arenaRing.push(w);
}

const gunRoot=new THREE.Group();
camera.add(gunRoot);
scene.add(camera);
const gun=new THREE.Mesh(new THREE.BoxGeometry(.18,.18,.72),new THREE.MeshBasicMaterial({color:0xd7d4c4}));
gun.position.set(.35,-.28,-.68);
gunRoot.add(gun);
const fist=new THREE.Mesh(new THREE.BoxGeometry(.35,.22,.28),new THREE.MeshBasicMaterial({color:0xffd2a1}));
fist.position.set(-.38,-.34,-.58);
gunRoot.add(fist);

const hud=document.getElementById("hud");
const msg=document.getElementById("msg");
const flash=document.getElementById("flash");

let yaw=0,pitch=0;
let health=100,weapon=1,kills=0,wave=0;
let locked=false,grounded=false,dead=false;
let time=0,last=performance.now();
let shake=0,flashA=0;
const player={
  pos:new THREE.Vector3(0,1.7,8),
  vel:new THREE.Vector3(),
  radius:.45,
  height:1.7,
  invuln:0,
  dash:0,
  dashCd:0,
  fireCd:0,
  parry:0,
  parryCd:0,
  parryUsed:false
};

const keys={};
const enemies=[];
const projectiles=[];
const particles=[];
const tracers=[];
const tmp=new THREE.Vector3();
const tmp2=new THREE.Vector3();
const raycaster=new THREE.Raycaster();

function rand(min,max){return min+Math.random()*(max-min)}
function flatDirToPlayer(e){
  tmp.copy(player.pos).sub(e.pos);
  tmp.y=0;
  const l=tmp.length()||1;
  return tmp.multiplyScalar(1/l).clone();
}
function camDir(){
  return new THREE.Vector3(0,0,-1).applyEuler(camera.rotation).normalize();
}
function rightDir(){
  return new THREE.Vector3(1,0,0).applyEuler(new THREE.Euler(0,yaw,0)).normalize();
}
function spawnEnemy(type){
  const a=Math.random()*Math.PI*2,r=22+Math.random()*22;
  const pos=new THREE.Vector3(Math.cos(a)*r,1,Math.sin(a)*r);
  const geo=type==="filth"?new THREE.ConeGeometry(.72,1.65,5):new THREE.BoxGeometry(1.1,1.45,1.1);
  const mesh=new THREE.Mesh(geo,type==="filth"?matGreen:matBlue);
  mesh.position.copy(pos);
  mesh.position.y=.82;
  scene.add(mesh);
  enemies.push({
    type,pos,mesh,
    hp:type==="filth"?55:75,
    maxHp:type==="filth"?55:75,
    vel:new THREE.Vector3(),
    attack:0,
    attackFrame:0,
    shoot:rand(.8,2.1),
    stun:0,
    dead:false
  });
}
function spawnWave(){
  wave++;
  for(let i=0;i<4+wave;i++)spawnEnemy("filth");
  for(let i=0;i<2+Math.floor(wave*.65);i++)spawnEnemy("stray");
}
function makeTracer(a,b,color){
  const geo=new THREE.BufferGeometry().setFromPoints([a.clone(),b.clone()]);
  const mat=new THREE.LineBasicMaterial({color,transparent:true,opacity:1});
  const line=new THREE.Line(geo,mat);
  scene.add(line);
  tracers.push({line,life:.08});
}
function bleed(pos,n=10){
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,.08),matBlood);
    m.position.copy(pos);
    scene.add(m);
    particles.push({mesh:m,vel:new THREE.Vector3(rand(-1,1),rand(.2,2.4),rand(-1,1)).multiplyScalar(rand(2,6)),life:rand(.25,.7)});
  }
}
function heal(v){
  health=Math.min(100,health+v);
  flashA=Math.max(flashA,.16);
}
function damagePlayer(v){
  if(player.invuln>0||dead)return;
  health-=v;
  shake=Math.max(shake,.45);
  flashA=Math.max(flashA,.3);
  player.invuln=.45;
  if(health<=0){health=0;dead=true;msg.textContent="DEAD | CLICK TO RESTART";}
}
function killEnemy(e,sourcePos){
  if(e.dead)return;
  e.dead=true;
  scene.remove(e.mesh);
  bleed(e.pos,18);
  kills++;
  if(sourcePos&&sourcePos.distanceTo(e.pos)<7.5)heal(18);
}
function hitEnemy(e,dmg,sourcePos){
  e.hp-=dmg;
  e.stun=.06;
  bleed(e.pos,6);
  if(e.hp<=0)killEnemy(e,sourcePos);
}
function fireRevolver(){
  const origin=player.pos.clone();
  const dir=camDir();
  raycaster.set(origin,dir);
  raycaster.far=80;
  const hits=raycaster.intersectObjects(enemies.filter(e=>!e.dead).map(e=>e.mesh),false);
  let end=origin.clone().addScaledVector(dir,80);
  if(hits.length){
    const mesh=hits[0].object;
    const e=enemies.find(x=>x.mesh===mesh);
    end.copy(hits[0].point);
    hitEnemy(e,62,origin);
    shake=Math.max(shake,.08);
  }
  makeTracer(origin,end,0xfff2a0);
}
function fireShotgun(){
  const origin=player.pos.clone();
  const base=camDir();
  for(let i=0;i<9;i++){
    const dir=base.clone();
    const spread=.085;
    dir.x+=rand(-spread,spread);
    dir.y+=rand(-spread,spread);
    dir.z+=rand(-spread,spread);
    dir.normalize();
    raycaster.set(origin,dir);
    raycaster.far=38;
    const hits=raycaster.intersectObjects(enemies.filter(e=>!e.dead).map(e=>e.mesh),false);
    let end=origin.clone().addScaledVector(dir,38);
    if(hits.length){
      const e=enemies.find(x=>x.mesh===hits[0].object);
      end.copy(hits[0].point);
      hitEnemy(e,24,origin);
    }
    makeTracer(origin,end,0xff9f55);
  }
  shake=Math.max(shake,.2);
}
function shoot(){
  if(player.fireCd>0||dead)return;
  if(weapon===1){fireRevolver();player.fireCd=.24;gun.position.z=-.54}
  else{fireShotgun();player.fireCd=.72;gun.position.z=-.42}
}
function startParry(){
  if(player.parryCd>0||dead)return;
  player.parry=.22;
  player.parryCd=.55;
  player.parryUsed=false;
}
function reflectProjectile(p){
  const dir=camDir();
  p.owner="player";
  p.vel.copy(dir).multiplyScalar(Math.max(p.speed*3,24));
  p.speed=p.vel.length();
  p.life=3.2;
  p.mesh.material=matOrbPlayer;
  p.reflected=true;
  player.parryUsed=true;
  shake=Math.max(shake,.52);
  heal(5);
}
function parryCheck(){
  if(player.parry<=0||player.parry> .17)return;
  const center=player.pos;
  const dir=camDir();
  for(const p of projectiles){
    if(p.dead||p.owner!=="enemy")continue;
    const to=tmp.copy(p.mesh.position).sub(center);
    const dist=to.length();
    const facing=dist>0?to.normalize().dot(dir):1;
    if(dist<3.25&&(facing>.12||dist<1.55))reflectProjectile(p);
  }
  for(const e of enemies){
    if(e.dead||e.type!=="filth"||e.attackFrame<=0)continue;
    const to=tmp.copy(e.pos).sub(center);
    const dist=to.length();
    const facing=dist>0?to.normalize().dot(dir):1;
    if(dist<3.05&&(facing>.0||dist<1.35)){
      killEnemy(e,center);
      heal(25);
      player.parryUsed=true;
      shake=Math.max(shake,.65);
    }
  }
}
function spawnOrb(e){
  const pos=e.pos.clone();
  pos.y=1.25;
  const dir=player.pos.clone().sub(pos).normalize();
  const mesh=new THREE.Mesh(new THREE.IcosahedronGeometry(.24,0),matOrbEnemy);
  mesh.position.copy(pos);
  scene.add(mesh);
  projectiles.push({mesh,vel:dir.multiplyScalar(6.2),speed:6.2,owner:"enemy",life:8,dead:false,reflected:false});
}
function updateEnemies(dt){
  for(const e of enemies){
    if(e.dead)continue;
    const dist=e.pos.distanceTo(player.pos);
    e.stun=Math.max(0,e.stun-dt);
    e.mesh.lookAt(player.pos.x,e.mesh.position.y,player.pos.z);
    if(e.type==="filth"){
      e.attack=Math.max(0,e.attack-dt);
      e.attackFrame=Math.max(0,e.attackFrame-dt);
      if(e.stun<=0){
        const dir=flatDirToPlayer(e);
        if(dist>2.1&&e.attack<=0)e.vel.addScaledVector(dir,26*dt);
        if(dist<7.5&&e.attack<=0){
          e.attack=.95;
          e.attackFrame=.22;
          e.vel.addScaledVector(dir,13);
          e.vel.y=3.5;
        }
      }
      e.vel.y-=20*dt;
      e.vel.multiplyScalar(Math.pow(.08,dt));
      e.pos.addScaledVector(e.vel,dt);
      if(e.pos.y<.82){e.pos.y=.82;e.vel.y=0}
      if(dist<1.25&&e.attackFrame>0){damagePlayer(18);e.attackFrame=0}
    }else{
      const dir=flatDirToPlayer(e);
      if(dist<8)e.vel.addScaledVector(dir,-20*dt);
      else if(dist>18)e.vel.addScaledVector(dir,12*dt);
      e.vel.multiplyScalar(Math.pow(.05,dt));
      e.pos.addScaledVector(e.vel,dt);
      e.pos.y=.82+Math.sin(time*4+e.pos.x)*.15;
      e.shoot-=dt;
      if(e.shoot<=0&&dist<38){
        spawnOrb(e);
        e.shoot=rand(1.8,3.4);
      }
    }
    e.mesh.position.copy(e.pos);
  }
  for(let i=enemies.length-1;i>=0;i--)if(enemies[i].dead)enemies.splice(i,1);
  if(enemies.length===0)spawnWave();
}
function updateProjectiles(dt){
  for(const p of projectiles){
    if(p.dead)continue;
    p.life-=dt;
    p.mesh.position.addScaledVector(p.vel,dt);
    p.mesh.rotation.x+=dt*9;
    p.mesh.rotation.y+=dt*12;
    if(p.life<=0||p.mesh.position.length()>95)p.dead=true;
    if(p.owner==="enemy"&&p.mesh.position.distanceTo(player.pos)<.82){
      p.dead=true;
      damagePlayer(24);
    }
    if(p.owner==="player"){
      for(const e of enemies){
        if(e.dead)continue;
        if(p.mesh.position.distanceTo(e.pos)<1.1){
          p.dead=true;
          hitEnemy(e,130,player.pos);
          shake=Math.max(shake,.18);
          break;
        }
      }
    }
  }
  for(let i=projectiles.length-1;i>=0;i--)if(projectiles[i].dead){scene.remove(projectiles[i].mesh);projectiles.splice(i,1)}
}
function updateParticles(dt){
  for(const p of particles){
    p.life-=dt;
    p.vel.y-=12*dt;
    p.mesh.position.addScaledVector(p.vel,dt);
    p.mesh.scale.multiplyScalar(Math.pow(.08,dt));
  }
  for(let i=particles.length-1;i>=0;i--)if(particles[i].life<=0){scene.remove(particles[i].mesh);particles.splice(i,1)}
}
function updateTracers(dt){
  for(const t of tracers){t.life-=dt;t.line.material.opacity=Math.max(0,t.life/.08)}
  for(let i=tracers.length-1;i>=0;i--)if(tracers[i].life<=0){scene.remove(tracers[i].line);tracers.splice(i,1)}
}
function updatePlayer(dt){
  if(dead)return;
  player.fireCd=Math.max(0,player.fireCd-dt);
  player.parryCd=Math.max(0,player.parryCd-dt);
  player.invuln=Math.max(0,player.invuln-dt);
  player.dashCd=Math.max(0,player.dashCd-dt);
  if(player.parry>0){
    player.parry=Math.max(0,player.parry-dt);
    parryCheck();
  }
  const wish=new THREE.Vector3();
  const fwd=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)*-1).normalize();
  const right=new THREE.Vector3(Math.cos(yaw),0,Math.sin(yaw));
  if(keys.KeyW)wish.add(fwd);
  if(keys.KeyS)wish.sub(fwd);
  if(keys.KeyD)wish.add(right);
  if(keys.KeyA)wish.sub(right);
  if(wish.lengthSq()>0)wish.normalize();
  const target=wish.multiplyScalar(grounded?13.5:10);
  player.vel.x+=(target.x-player.vel.x)*Math.min(1,dt*15);
  player.vel.z+=(target.z-player.vel.z)*Math.min(1,dt*15);
  if(keys.Space&&grounded){player.vel.y=8.4;grounded=false}
  if(keys.ShiftLeft&&player.dashCd<=0){
    const d=wish.lengthSq()>0?wish.normalize():camDir().setY(0).normalize();
    player.vel.x=d.x*34;
    player.vel.z=d.z*34;
    player.invuln=.28;
    player.dashCd=.9;
    shake=Math.max(shake,.12);
  }
  player.vel.y-=22*dt;
  player.pos.addScaledVector(player.vel,dt);
  if(player.pos.y<1.7){player.pos.y=1.7;player.vel.y=0;grounded=true}
  const r=Math.hypot(player.pos.x,player.pos.z);
  if(r>56){
    player.pos.x*=56/r;
    player.pos.z*=56/r;
  }
}
function updateView(dt){
  let sx=0,sy=0;
  if(shake>0){
    sx=(Math.random()-.5)*shake*.14;
    sy=(Math.random()-.5)*shake*.14;
    shake=Math.max(0,shake-dt*1.8);
  }
  camera.position.copy(player.pos);
  camera.rotation.order="YXZ";
  camera.rotation.y=yaw+sx;
  camera.rotation.x=pitch+sy;
  gun.position.z+=(-.68-gun.position.z)*Math.min(1,dt*18);
  gun.rotation.x=Math.sin(time*10)*.015;
  if(player.parry>0){
    const k=1-player.parry/.22;
    fist.position.set(-.38+Math.sin(k*Math.PI)*.5,-.34+Math.sin(k*Math.PI)*.18,-.58-Math.sin(k*Math.PI)*.46);
    fist.rotation.y=-Math.sin(k*Math.PI)*1.9;
    fist.rotation.x=Math.sin(k*Math.PI)*.7;
  }else{
    fist.position.lerp(new THREE.Vector3(-.38,-.34,-.58),Math.min(1,dt*16));
    fist.rotation.x*=Math.pow(.02,dt);
    fist.rotation.y*=Math.pow(.02,dt);
  }
  flashA=Math.max(0,flashA-dt*1.8);
  flash.style.opacity=flashA;
  flash.style.background=player.invuln>0?"#ff4058":"#fff";
  hud.textContent=`HP ${Math.round(health)} | ${weapon===1?"REVOLVER":"SHOTGUN"} | KILLS ${kills} | WAVE ${wave} | DASH ${player.dashCd>0?player.dashCd.toFixed(1):"READY"} | PARRY ${player.parryCd>0?player.parryCd.toFixed(1):"READY"}`;
}
function restart(){
  health=100;kills=0;wave=0;dead=false;
  player.pos.set(0,1.7,8);
  player.vel.set(0,0,0);
  player.invuln=1;
  for(const e of enemies)scene.remove(e.mesh);
  for(const p of projectiles)scene.remove(p.mesh);
  enemies.length=0;projectiles.length=0;
  msg.textContent="";
  spawnWave();
}
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.033,(now-last)/1000||.016);
  last=now;time+=dt;
  updatePlayer(dt);
  updateEnemies(dt);
  updateProjectiles(dt);
  updateParticles(dt);
  updateTracers(dt);
  updateView(dt);
  renderer.render(scene,camera);
}
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
document.addEventListener("click",()=>{
  if(dead)restart();
  renderer.domElement.requestPointerLock();
});
document.addEventListener("pointerlockchange",()=>{
  locked=document.pointerLockElement===renderer.domElement;
  msg.textContent=locked&&!dead?"":dead?"DEAD | CLICK TO RESTART":"CLICK TO LOCK | WASD SPACE SHIFT | 1 REVOLVER 2 SHOTGUN | F / RMB PARRY";
});
document.addEventListener("mousemove",e=>{
  if(!locked)return;
  yaw-=e.movementX*.0024;
  pitch-=e.movementY*.0024;
  pitch=Math.max(-1.45,Math.min(1.45,pitch));
});
document.addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(e.code==="Digit1")weapon=1;
  if(e.code==="Digit2")weapon=2;
  if(e.code==="KeyF")startParry();
});
document.addEventListener("keyup",e=>keys[e.code]=false);
document.addEventListener("mousedown",e=>{
  if(!locked)return;
  if(e.button===0)shoot();
  if(e.button===2)startParry();
});
document.addEventListener("contextmenu",e=>e.preventDefault());

spawnWave();
requestAnimationFrame(loop);
</script>
</body>
</html>
